name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MGR" ]; then
            MGR="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | sort | tail -n1)"
          fi
          yes | "$MGR" --licenses > /dev/null || true
          "$MGR" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build + unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ash-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
